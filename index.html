<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Photo - Partage Privé & Public</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; transition: all 0.2s ease; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
    }
    button {
      background: #6366f1;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .photo-card {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    .photo-card img { width: 100%; height: 200px; object-fit: cover; }
    .photo-info { padding: 12px; font-size: 0.9em; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: bold;
    }
    .badge-private { background: #ef4444; }
    .badge-public { background: #22c55e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1>📷 Studio Photo</h1>
      <div id="user-info"></div>
    </div>

    <!-- Section Connexion / Inscription -->
    <div id="auth-section" class="card">
      <h2>Connexion / Inscription</h2>
      <input type="email" id="email" placeholder="Votre Adresse E-mail">
      <input type="password" id="password" placeholder="Votre Mot de passe">
      <input type="text" id="pseudo" placeholder="Votre Pseudo (Optionnel)">
      <div style="display: flex; gap: 10px;">
        <button onclick="connexion()">Se connecter</button>
        <button onclick="inscription()" style="background:#059669;">S'inscrire</button>
      </div>
    </div>

    <!-- Section Importation & Galerie -->
    <div id="app-section" class="card" style="display:none;">
      <h2>Ajouter une Photo</h2>
      <form id="upload-form">
        <input type="file" id="photo-file" accept="image/*" required>
        <label>
          <input type="checkbox" id="photo-private" style="width:auto;"> Mode Privé
        </label>
        <button type="submit">Téléverser</button>
      </form>

      <h2>Galerie de Photos</h2>
      <div id="gallery" class="gallery"></div>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('user'));

    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        document.getElementById('user-info').innerHTML = `
          <span>Connecté : <strong>${currentUser.pseudo}</strong></span>
          <button onclick="deconnexion()" style="width:auto; margin-left:10px; padding:6px 12px; background:#dc2626;">Déconnexion</button>
        `;
        chargerPhotos();
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('app-section').style.display = 'none';
        document.getElementById('user-info').innerHTML = '';
      }
    }

    async function connexion() {
      const email = document.getElementById('email').value;
      const mot_de_passe = document.getElementById('password').value;

      const res = await fetch('/api/connexion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, mot_de_passe })
      });

      if (res.ok) {
        currentUser = await res.json();
        localStorage.setItem('user', JSON.stringify(currentUser));
        updateUI();
      } else {
        alert(await res.text());
      }
    }

    async function inscription() {
      const email = document.getElementById('email').value;
      const mot_de_passe = document.getElementById('password').value;
      const pseudo = document.getElementById('pseudo').value;

      const res = await fetch('/api/inscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, mot_de_passe, pseudo })
      });

      if (res.ok) {
        alert('Compte créé avec succès ! Vous pouvez vous connecter.');
      } else {
        alert(await res.text());
      }
    }

    function deconnexion() {
      localStorage.removeItem('user');
      currentUser = null;
      updateUI();
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('photo-file');
      const isPrivate = document.getElementById('photo-private').checked;

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);
      formData.append('est_prive', isPrivate);

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'user-id': currentUser.id },
        body: formData
      });

      if (res.ok) {
        fileInput.value = '';
        chargerPhotos();
      } else {
        alert(await res.text());
      }
    });

    async function chargerPhotos() {
      const res = await fetch('/api/photos', {
        headers: { 'user-id': currentUser.id }
      });

      if (res.ok) {
        const photos = await res.json();
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = photos.map(p => `
          <div class="photo-card">
            <img src="/uploads/${p.nom_fichier}" alt="Photo">
            <div class="photo-info">
              <div><strong>Auteur :</strong> ${p.pseudo || 'Anonyme'}</div>
              <div style="margin-top: 6px;">
                <span class="badge ${p.est_prive ? 'badge-private' : 'badge-public'}">
                  ${p.est_prive ? 'Privée' : 'Publique'}
                </span>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    updateUI();
  </script>
</body>
</html>
